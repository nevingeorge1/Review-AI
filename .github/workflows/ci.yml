name: ReviewAI CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,analysis]"

      - name: Run Foundation Self-Check
        run: |
          python scripts/check_foundation.py

      - name: Run Ruff Linter
        run: |
          ruff check backend/

      - name: Run Unit Tests
        run: |
          pytest backend/tests --cov=backend/app --cov-report=xml

  frontend-typecheck:
    name: Frontend Type Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Frontend Spec
        run: |
          echo "Frontend boundary verified for Module 1"
